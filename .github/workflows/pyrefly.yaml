name: Pyrefly

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🏗 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: 🏗 Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: 👀 Cache prek
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: 🏗 Install dependencies
        run: |
          uv venv .venv/
          uv pip install --requirement requirements.txt

      - name: 🏗 Install dev dependencies
        run: |
          uv pip install prek

      - name: 🏗 Install workflow dependencies (pyhaopenmotics)
        run: uv pip install .

      - name: 🏗 Install pyrefly
        # if we install it via uv pip install, it cannot be found afterwards.
        run: pip install pyrefly

      - name: 🚀 Run pre-commit (prek)
        run: |
          # Enable color output for prek
          # prek run --all-files --show-diff-on-failure --color always
          uvx prek run pyrefly-check --all-files --show-diff-on-failure --color always
